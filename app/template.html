<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squid BBS intro, modern version</title>
<meta name="description" content="A BBS-style intro based on the 1994 Squid BBS intro by cld & The Doctor.">
<!--
  Modern version of the Squid BBS intro, with its own text.
  Based on SQUID1.COM (1994, Curitiba, Brazil): code & muzak by cld, AdLib player by
  The Doctor. The original was released as freeware with its source; the authors ask
  to be credited, and the credit line on screen is part of this page.
  Original program, source and freeware note (Hornet Archive, March 1994):
  https://hornet.org/code/demosrc/bbsintro/sqd1_src.zip
  Built from app/ and src/ by tools/build.py.
  Sound button or M for sound; - / + buttons or left/right arrows change the scroll speed.
-->
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; padding-bottom: 44px; box-sizing: border-box; }
  #wrap { position: relative; line-height: 0; }
  #screen { display: block; image-rendering: pixelated; }
  /* soft tube-monitor vignette (no scanlines: they beat against the text pixels) */
  #crt { position: absolute; inset: 0; pointer-events: none; }
  #crt.on { background: radial-gradient(ellipse at center, transparent 62%, rgba(0,0,0,.38) 100%); }
  /* real links laid over the text cells drawn on the canvas */
  #links { position: absolute; left: 0; top: 0; }
  #links a { position: absolute; color: transparent; overflow: hidden; white-space: nowrap;
             font-size: 1px; outline-offset: 2px; }
  #links a:hover, #links a:focus-visible { box-shadow: inset 0 -2px 0 #5ff; background: rgba(85,255,255,.12); }
  #hud {
    position: fixed; right: 12px; bottom: 8px; display: flex; gap: 6px; align-items: center;
    font: 13px/1 ui-monospace, Menlo, Consolas, monospace; color: #2aa;
    transition: opacity .6s;
  }
  #hud.idle { opacity: .35; }
  #hud:hover, #hud:focus-within { opacity: 1; }
  #hud button {
    font: inherit; color: #5ff; background: #011; border: 1px solid #155; border-radius: 3px;
    padding: 6px 9px; cursor: pointer;
  }
  #hud button:hover { border-color: #5ff; }
  #hud button[aria-pressed="true"] { color: #000; background: #5ff; }
  #note { margin-right: 6px; }
  #speed { min-width: 3.5em; text-align: center; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="screen" aria-label="Scrolling BBS-style message over copper bars"></canvas>
  <div id="crt"></div>
  <div id="links"></div>
</div>
<div id="hud">
  <span id="note" aria-live="polite"></span>
  <button id="sound" type="button" aria-pressed="false" title="Sound on/off (M)">&#9834; sound off</button>
  <button id="slower" type="button" title="Slower (&larr;)" aria-label="Slower">&minus;</button>
  <span id="speed" title="Scroll speed">1&times;</span>
  <button id="faster" type="button" title="Faster (&rarr;)" aria-label="Faster">+</button>
</div>
<script>window.SQUID_ASSETS = { com: "%%COM%%", font: "%%FONT%%" };</script>
<script>%%GLYPHS%%</script>
<script>%%CONFIG%%</script>
<script>%%OPL2%%</script>
<script>%%CORE%%</script>
<script>%%VGA%%</script>
<script>%%MAIN%%</script>
</body>
</html>
